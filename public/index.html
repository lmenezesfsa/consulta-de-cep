<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Consulta de CEP</title>
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('nexus-cep-tema');
        var preferEscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var escuro = tema === 'escuro' || (!tema && preferEscuro);
        document.documentElement.classList.toggle('dark', escuro);
      } catch (erro) {
        /* localStorage indisponível (ex.: modo privado); mantém tema claro padrão */
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="pagina">
    <div class="cartao-app">
      <header class="cabecalho">
        <div class="cabecalho-textos">
          <h1>Consulta de CEP</h1>
          <p class="subtitulo">Digite um CEP para ver o endereço completo.</p>
        </div>
        <button
          type="button"
          id="botao-tema"
          class="botao botao-ghost botao-somente-icone"
          aria-label="Ativar modo escuro"
          title="Alternar tema"
        >
          <svg class="icone icone-sol" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="M4.93 4.93l1.41 1.41"></path>
            <path d="M17.66 17.66l1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="M4.93 19.07l1.41-1.41"></path>
            <path d="M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icone icone-lua" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </button>
      </header>

      <form id="form-cep" class="form-cep" novalidate>
        <div class="campo">
          <label for="input-cep">CEP</label>
          <input
            type="text"
            id="input-cep"
            name="cep"
            inputmode="numeric"
            placeholder="00000-000"
            maxlength="9"
            autocomplete="off"
            aria-describedby="dica-cep"
          />
          <p id="dica-cep" class="dica">Formato: 00000-000</p>
        </div>
        <button type="submit" id="botao-consultar" class="botao botao-primario">
          <svg class="icone icone-busca" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <svg class="icone icone-spinner" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden>
            <circle cx="12" cy="12" r="9" stroke-opacity="0.25"></circle>
            <path d="M21 12a9 9 0 0 0-9-9"></path>
          </svg>
          <span class="texto-botao">Consultar</span>
        </button>
      </form>

      <div id="mensagem-erro" class="alerta alerta-erro" role="alert" hidden>
        <svg class="icone" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v4"></path>
          <path d="M12 16h.01"></path>
        </svg>
        <span id="mensagem-erro-texto" class="alerta-texto"></span>
      </div>

      <section id="resultado" class="resultado" aria-live="polite"></section>
    </div>

    <p class="rodape">Dados consultados via ViaCEP, com reserva na BrasilAPI.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
